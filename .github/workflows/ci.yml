name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The two app extras pin numpy against each other, so CI installs the base
      # package plus the scoring extra only. A clone that cannot import the pipeline
      # is the failure this catches; app-specific deps are an app-local concern.
      - name: install
        run: pip install -e ".[scoring,dev]"

      - name: lint
        run: ruff check src scripts tests

      - name: tests
        run: pytest -q

  warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install dbt
        run: pip install -e ".[warehouse]"
      # Builds off warehouse/sample_data fixtures, so this needs zero credentials.
      # If it ever needs a secret, the fixtures regressed, not the CI.
      - name: dbt build
        working-directory: warehouse
        run: dbt build --profiles-dir .
