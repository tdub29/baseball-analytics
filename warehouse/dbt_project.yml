name: "usd_baseball_warehouse"
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
# See profiles.example.yml — copy it to ~/.dbt/profiles.yml (or set
# DBT_PROFILES_DIR=.) and it will resolve with zero credentials (DuckDB).
profile: "usd_baseball_warehouse"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# vars let the sources point at either the full real CSVs (dev) or the small
# committed sample fixtures (ci). CI overrides these on the command line / via
# the `ci` target's outputs. Defaults below = sample fixtures, so a fresh clone
# with no real data still builds green.
vars:
  # path is resolved relative to the dbt project dir (warehouse/)
  trackman_csv: "sample_data/sample_trackman_pitches.csv"
  six43_pitching_csv: "sample_data/sample_643_pitching.csv"
  six43_hitting_csv: "sample_data/sample_643_hitting.csv"

models:
  usd_baseball_warehouse:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  usd_baseball_warehouse:
    +schema: seeds
    pitch_type_map:
      +column_types:
        pitch_type: varchar
        code: varchar
